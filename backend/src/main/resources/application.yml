server:
  port: ${CMS_SERVER_PORT:8080}

spring:
  datasource:
    url: ${CMS_DB_URL:jdbc:postgresql://localhost:5432/self_website}
    username: ${CMS_DB_USERNAME:self_website}
    password: ${CMS_DB_PASSWORD:self_website}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    admin:
      username: ${CMS_ADMIN_USERNAME:cmsadmin}
      password: ${CMS_ADMIN_PASSWORD:change-me-now}
  cors:
    allowed-origins: ${CMS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    allowed-origin-patterns: ${CMS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:5173,http://192.168.*:5174,http://10.*:5173,http://10.*:5174}
