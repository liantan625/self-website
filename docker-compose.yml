services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: self_website
      POSTGRES_USER: self_website
      POSTGRES_PASSWORD: self_website
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U self_website -d self_website"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CMS_SERVER_PORT: 8080
      CMS_DB_URL: jdbc:postgresql://postgres:5432/self_website
      CMS_DB_USERNAME: self_website
      CMS_DB_PASSWORD: self_website
      CMS_ADMIN_USERNAME: cmsadmin
      CMS_ADMIN_PASSWORD: change-me-now
      CMS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://100.95.137.108:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      args:
        VITE_CMS_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
